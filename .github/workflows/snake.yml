name: Gerar animacao de contribuicoes

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%230b2ca3&color_dots=%23ebedf0,%23b9c6f5,%236685f5,%232a51d8,%230b2ca3
            dist/github-snake-dark.svg?color_snake=%236685f5&color_dots=%23161b22,%230b2ca3,%232a51d8,%23496ef3,%236685f5

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
